
<div
  class="flex w-full gap-3 py-4"
  [class.flex-row-reverse]="isUser"
  [class.justify-start]="!isUser"
  [class.justify-end]="isUser"
>
  <!-- Avatar -->
  <div
    class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl text-[#081321]"
    [class.bg-gradient-to-br]="true"
    [class.from-sky-300]="!isUser"
    [class.to-sky-600]="!isUser"
    [class.from-yellow-300]="isUser"
    [class.to-yellow-500]="isUser"
  >
    <span class="text-sm font-extrabold">
      {{ isUser ? 'G' : 'S' }}
    </span>
  </div>

  <!-- Message Content -->
  <div
    class="flex w-full max-w-[85%] flex-col gap-2 sm:max-w-[80%]"
    [class.items-end]="isUser"
    [class.items-start]="!isUser"
  >
    <!-- Sender and Timestamp -->
    <div class="flex items-center gap-2 px-1">
      <span class="text-xs font-semibold text-slate-300">
        {{ isUser ? 'You' : 'SupportIQ AI' }}
      </span>

      <span class="text-[10px] text-slate-500">
        {{ timestamp | date:'shortTime' }}
      </span>
    </div>

    <!-- Message Bubble -->
    <div
      class="message-bubble rounded-2xl px-4 py-3 text-sm leading-7"
      [class.user-bubble]="isUser"
      [class.assistant-bubble]="!isUser"
    >
      <p class="whitespace-pre-wrap break-words">
        {{ content }}
      </p>
    </div>
  </div>
</div>
