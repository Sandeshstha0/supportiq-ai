
<aside
  [class.w-20]="collapsed()"
  [class.w-72]="!collapsed()"
  class="sidebar-container flex h-screen shrink-0 flex-col border-r border-slate-800 bg-[#0b1120] text-slate-100 transition-all duration-300 ease-in-out"
>

  <!-- Brand and Toggle -->
  <div class="flex h-[88px] items-center border-b border-slate-800 px-4"
       [class.justify-center]="collapsed()"
       [class.justify-between]="!collapsed()">

    @if (!collapsed()) {
      <div class="flex items-center gap-3">
        <div class="flex h-11 w-11 items-center justify-center rounded-xl bg-blue-600 shadow-lg shadow-blue-600/20">
          <span class="text-2xl font-bold">S</span>
        </div>

        <div>
          <h1 class="text-lg font-bold">SupportIQ AI</h1>
          <p class="text-xs text-slate-400">Powered by Lasata</p>
        </div>
      </div>
    } @else {
      <div class="flex h-11 w-11 items-center justify-center rounded-xl bg-blue-600 font-bold text-2xl">
        S
      </div>
    }

    <button
      (click)="toggleSidebar()"
      class="flex h-9 w-9 items-center justify-center rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition"
      [title]="collapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
    >
      @if (collapsed()) {
        <span>»</span>
      } @else {
        <span>«</span>
      }
    </button>

  </div>

  <!-- New Conversation -->
  <div class="p-4">

    <button
      class="flex h-12 w-full items-center justify-center gap-2 rounded-xl bg-blue-600 px-3 text-sm font-semibold text-white transition hover:bg-blue-500"
      title="New Conversation"
    >
      <span class="text-xl">+</span>

      @if (!collapsed()) {
        <span>New Conversation</span>
      }
    </button>

  </div>

  <!-- Navigation -->
  <div class="px-3 py-3">

    @if (!collapsed()) {
      <p class="mb-4 px-2 text-xs font-semibold uppercase tracking-widest text-slate-500">
        Workspace
      </p>
    }

    <nav class="space-y-2">

      <button
        title="AI Assistant"
        [class.justify-center]="collapsed()"
        class="flex w-full items-center gap-3 rounded-lg bg-blue-500/10 px-3 py-3 text-sm font-medium text-blue-400"
      >
        <span class="text-lg">◫</span>
        @if (!collapsed()) {
          <span>AI Assistant</span>
        }
      </button>

      <button
        title="Conversation History"
        [class.justify-center]="collapsed()"
        class="flex w-full items-center gap-3 rounded-lg px-3 py-3 text-sm text-slate-400 transition hover:bg-slate-800 hover:text-white"
      >
        <span class="text-lg">◷</span>
        @if (!collapsed()) {
          <span>Conversation History</span>
        }
      </button>

      <button
        title="Support Tickets"
        [class.justify-center]="collapsed()"
        class="flex w-full items-center gap-3 rounded-lg px-3 py-3 text-sm text-slate-400 transition hover:bg-slate-800 hover:text-white"
      >
        <span class="text-lg">◈</span>
        @if (!collapsed()) {
          <span>Support Tickets</span>
        }
      </button>

    </nav>

  </div>

  <!-- Recent Conversations -->
  @if (!collapsed()) {
    <div class="custom-scrollbar min-h-0 flex-1 overflow-y-auto px-4 py-5">

      <div class="mb-4 flex items-center justify-between px-2">
        <p class="text-xs font-semibold uppercase tracking-widest text-slate-500">
          Recent Conversations
        </p>
        <span class="text-xs text-slate-500">03</span>
      </div>

      <div class="space-y-1">

        <button class="w-full truncate rounded-lg px-3 py-3 text-left text-sm text-slate-400 transition hover:bg-slate-800 hover:text-white">
          Product availability
        </button>

        <button class="w-full truncate rounded-lg px-3 py-3 text-left text-sm text-slate-400 transition hover:bg-slate-800 hover:text-white">
          Delivery information
        </button>

        <button class="w-full truncate rounded-lg px-3 py-3 text-left text-sm text-slate-400 transition hover:bg-slate-800 hover:text-white">
          Return policy inquiry
        </button>

      </div>

    </div>
  } @else {
    <div class="flex-1"></div>
  }

  <!-- Customer Profile -->
  <div class="border-t border-slate-800 p-3">

    <div
      class="flex items-center gap-3 rounded-xl p-2 transition hover:bg-slate-800"
      [class.justify-center]="collapsed()"
    >

      <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-indigo-600 font-semibold text-white">
        G
      </div>

      @if (!collapsed()) {
        <div class="min-w-0 flex-1">
          <p class="truncate text-sm font-semibold text-white">
            Guest Customer
          </p>
          <p class="text-xs text-slate-500">
            Lasata Customer
          </p>
        </div>

        <span class="text-slate-500">⋯</span>
      }

    </div>

  </div>

</aside>
