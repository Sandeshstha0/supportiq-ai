
<header class="relative flex h-[76px] shrink-0 items-center justify-between border-b border-sky-400/10 bg-[#0B1424] px-5 md:px-8">

  <!-- Decorative accent -->
  <div class="pointer-events-none absolute left-0 top-0 h-[2px] w-32 bg-gradient-to-r from-sky-400 to-transparent"></div>

  <!-- Left: Title -->
  <div class="flex min-w-0 items-center gap-3">

    <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl border border-sky-400/20 bg-sky-400/10">
      <span class="text-xl text-sky-400">✦</span>
    </div>

    <div class="min-w-0">
      <h2 class="truncate text-sm font-bold tracking-wide text-white md:text-base">
        AI Customer Assistant
      </h2>

      <p class="mt-0.5 truncate text-xs text-slate-500">
        Your intelligent shopping companion
      </p>
    </div>

  </div>

  <!-- Right: Status and Actions -->
  <div class="flex shrink-0 items-center gap-3">

    <!-- Model badge -->
    <div class="hidden items-center gap-2 rounded-full border border-green-400/15 bg-green-400/5 px-3 py-2 sm:flex">
      <span class="h-1.5 w-1.5 rounded-full bg-green-400"></span>

      <span class="text-xs font-medium text-green-400">
        Gemini AI
      </span>
    </div>

    <!-- Dynamic Backend Status -->
    <button
      type="button"
      (click)="checkBackend()"
      title="Click to check backend connection"
      class="flex items-center gap-2 rounded-full border px-3 py-2 transition"
      [ngClass]="{
        'border-emerald-400/20 bg-emerald-400/5 text-emerald-400':
          backendStatus === 'online',

        'border-red-400/20 bg-red-400/5 text-red-400':
          backendStatus === 'offline',

        'border-yellow-400/20 bg-yellow-400/5 text-yellow-400':
          backendStatus === 'checking'
      }"
    >

      <span
        class="h-2 w-2 rounded-full"
        [ngClass]="{
          'bg-emerald-400': backendStatus === 'online',
          'bg-red-400': backendStatus === 'offline',
          'bg-yellow-400 animate-pulse': backendStatus === 'checking'
        }"
      ></span>

      <span class="text-xs font-medium">
        {{
          backendStatus === 'online'
            ? 'Online'
            : backendStatus === 'offline'
              ? 'Offline'
              : 'Checking...'
        }}
      </span>

    </button>

    <!-- More options -->
    <button
      type="button"
      title="More options"
      class="flex h-9 w-9 items-center justify-center rounded-xl border border-slate-700/70 bg-slate-800/40 text-slate-400 transition hover:border-sky-400/30 hover:bg-sky-400/10 hover:text-sky-300"
    >
      <span class="text-xl">⋯</span>
    </button>

  </div>

</header>
