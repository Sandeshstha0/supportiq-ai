
<div class="relative shrink-0 border-t border-sky-400/10 bg-[#0B1424] px-4 pb-5 pt-4 md:px-8">

  <!-- Decorative top line -->
  <div class="pointer-events-none absolute left-1/2 top-0 h-px w-1/3 -translate-x-1/2 bg-gradient-to-r from-transparent via-sky-400/40 to-transparent"></div>

  <div class="mx-auto max-w-4xl">

    <!-- Message Composer -->
    <div class="composer-box group relative rounded-2xl border border-slate-700/70 bg-[#111E30] p-3 transition-all duration-300 focus-within:border-sky-400/50 focus-within:shadow-[0_0_25px_rgba(56,189,248,0.07)]">

      <!-- Textarea -->
      <textarea
        [(ngModel)]="message"
        (keydown)="handleKeydown($event)"
        placeholder="Ask anything about Lasata..."
        rows="1"
        maxlength="2000"
        class="max-h-36 min-h-12 w-full resize-none bg-transparent px-3 py-3 text-sm leading-6 text-slate-100 outline-none placeholder:text-slate-500"
      ></textarea>

      <!-- Bottom Actions -->
      <div class="flex items-center justify-between gap-3 px-2 pt-2">

        <!-- Left actions -->
        <div class="flex items-center gap-2">

          <button
            type="button"
            title="Attach file (coming soon)"
            disabled
            class="flex h-9 w-9 cursor-not-allowed items-center justify-center rounded-xl text-slate-600"
          >
            <span class="text-xl">＋</span>
          </button>

          <span class="hidden text-xs text-slate-500 sm:block">
            Ask about products, orders or store policies
          </span>

        </div>

        <!-- Right actions -->
        <div class="flex items-center gap-3">

          <span class="hidden text-[10px] text-slate-600 sm:block">
            {{ message().length }}/2000
          </span>

          <button
            type="button"
            (click)="sendMessage()"
            [disabled]="!message().trim() || isLoading()"
            class="flex h-10 w-10 items-center justify-center rounded-xl bg-gradient-to-br from-sky-300 to-sky-500 text-[#081321] shadow-lg shadow-sky-500/20 transition duration-200 hover:scale-105 hover:shadow-sky-400/30 disabled:cursor-not-allowed disabled:opacity-30 disabled:hover:scale-100"
            title="Send message"
          >

            <span class="text-xl font-bold">↑</span>

          </button>

        </div>

      </div>

    </div>

    <!-- Disclaimer -->
    <div class="mt-3 flex items-center justify-center gap-2 text-center">

      <span class="text-xs text-yellow-400">✦</span>

      <p class="text-[10px] leading-5 text-slate-500 sm:text-xs">
        SupportIQ AI can make mistakes. Verify important information with Lasata.
      </p>

    </div>

  </div>

</div>
