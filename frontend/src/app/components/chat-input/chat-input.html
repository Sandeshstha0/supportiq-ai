
<div class="relative shrink-0 border-t border-sky-400/10 bg-[#0B1424] px-4 pb-5 pt-4 md:px-8">
  <div class="mx-auto max-w-4xl">

    <div
      class="composer-box rounded-2xl border border-slate-700/70 bg-[#111E30] p-3"
      [class.composer-expanded]="isExpanded()"
    >
      <textarea
        [(ngModel)]="message"
        (focus)="expandInput()"
        (input)="expandInput()"
        (blur)="collapseInput()"
        (keydown)="handleKeydown($event)"
        placeholder="Ask anything about Lasata..."
        [rows]="isExpanded() ? 3 : 1"
        maxlength="2000"
        class="w-full resize-none bg-transparent px-3 py-3 text-sm leading-6 text-slate-100 outline-none placeholder:text-slate-500"
      ></textarea>

      <div class="flex items-center justify-between gap-3 px-2 pt-2">
        <span class="text-xs text-slate-500">
          Ask about products, orders or store policies
        </span>

        <div class="flex items-center gap-3">
          <span class="text-[10px] text-slate-600">
            {{ message().length }}/2000
          </span>

          <button
            type="button"
            (click)="sendMessage()"
            [disabled]="!message().trim() || isLoading()"
            class="flex h-10 w-10 items-center justify-center rounded-xl bg-gradient-to-br from-sky-300 to-sky-500 text-xl font-bold text-[#081321] transition hover:scale-105 disabled:opacity-30"
            title="Send message"
          >
            ↑
          </button>
        </div>
      </div>
    </div>

    <p class="mt-3 text-center text-xs text-slate-500">
      <span class="text-yellow-400">✦</span>
      SupportIQ AI can make mistakes. Verify important information with Lasata.
    </p>

  </div>
</div>
